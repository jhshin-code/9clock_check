<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주일 말씀 출석부</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #3b5bdb;
            --primary-light: #e7f0ff;
            --accent: #f03e3e;
            --gold: #f59f00;
            --green: #2f9e44;
            --orange: #e67700;
            --bg: #f0f4ff;
            --card: #ffffff;
            --text: #1a1d23;
            --muted: #6e7990;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(59,91,219,0.10);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ====== 메인 앱 ====== */
        .container {
            max-width: 440px;
            margin: 0 auto;
            background: var(--card);
            min-height: 100vh;
            padding: 28px 20px 40px;
            position: relative;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }
        .app-header h2 {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .church-icon {
            width: 36px; height: 36px;
            background: var(--primary);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        /* 시계 카드 */
        .clock-card {
            background: linear-gradient(135deg, var(--primary) 0%, #4c6ef5 100%);
            border-radius: var(--radius);
            padding: 20px;
            color: white;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .clock-card::before {
            content: '';
            position: absolute;
            top: -30px; right: -30px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        #live-clock {
            font-size: 38px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            font-family: 'Inter', sans-serif;
        }
        #time-msg {
            font-size: 13px;
            margin-top: 6px;
            opacity: 0.9;
        }
        .time-ok { color: #a3f5c0; }
        .time-no { color: #ffb3b3; }
        .time-admin { color: #ffe066; }
        #gps-msg {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.75;
        }

        /* 입력 카드 */
        .input-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
        }
        .input-row { display: flex; gap: 10px; }
        .input-col { flex: 1; }
        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        select {
            width: 100%;
            padding: 12px 10px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Noto Sans KR', sans-serif;
            background: white;
            outline: none;
            transition: border 0.2s;
            color: var(--text);
        }
        select:focus { border-color: var(--primary); }

        /* 버튼들 */
        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), #4c6ef5);
            color: white;
            letter-spacing: -0.3px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(59,91,219,0.3);
        }
        .btn-primary:disabled {
            background: #dce1ec;
            color: #9aa3b5;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-primary:not(:disabled):active { transform: scale(0.98); }

        .btn-outline {
            width: 100%;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: white;
            color: var(--text);
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.15s;
        }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .btn-link {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            display: block;
            text-align: center;
            margin-top: 12px;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* ====== 모달 ====== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15,20,40,0.55);
            backdrop-filter: blur(6px);
        }
        .modal-sheet {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: white;
            border-radius: 24px 24px 0 0;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-handle {
            width: 40px; height: 4px;
            background: #ddd;
            border-radius: 4px;
            margin: 12px auto 0;
            flex-shrink: 0;
        }
        .modal-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .modal-title { font-size: 17px; font-weight: 800; }
        .close-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--bg);
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted);
        }

        /* ====== 출석 현황판 탭 ====== */
        .dashboard-tabs {
            display: flex;
            padding: 12px 16px 0;
            gap: 6px;
            flex-shrink: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .dashboard-tabs::-webkit-scrollbar { display: none; }
        .dtab {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            color: var(--muted);
            font-family: 'Noto Sans KR', sans-serif;
            transition: all 0.15s;
        }
        .dtab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* 탭 패널 스크롤 영역 */
        .dashboard-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
        }

        /* 섹션 카드 */
        .section-card {
            background: var(--bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.3px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title .count-badge {
            background: var(--primary);
            color: white;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
        }

        /* 오늘 명단 */
        .today-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .today-item:last-child { border-bottom: none; }
        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 800;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .today-name { font-weight: 700; font-size: 14px; flex: 1; }
        .today-meta { font-size: 11px; color: var(--muted); }

        /* 배지 */
        .badge {
            padding: 3px 9px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-ok { background: #d3f9d8; color: #2f9e44; }
        .badge-warn { background: #fff3bf; color: #e67700; }
        .badge-danger { background: #ffe3e3; color: #c92a2a; }
        .badge-info { background: #d0ebff; color: #1971c2; }
        .badge-grey { background: #f1f3f5; color: #868e96; }

        /* 분기 필터 */
        .quarter-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .q-chip {
            padding: 5px 12px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: white;
            color: var(--muted);
            font-family: 'Noto Sans KR', sans-serif;
            transition: all 0.15s;
        }
        .q-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* 차트 래퍼 */
        .chart-wrap { height: 200px; position: relative; }

        /* 랭킹 */
        .rank-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
        }
        .rank-item:last-child { border-bottom: none; }
        .rank-num {
            width: 28px;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            font-family: 'Inter', sans-serif;
            color: var(--muted);
        }
        .rank-num.gold { color: #f59f00; }
        .rank-num.silver { color: #868e96; }
        .rank-num.bronze { color: #c9843c; }
        .rank-info { flex: 1; }
        .rank-name { font-weight: 700; font-size: 14px; }
        .rank-dept { font-size: 11px; color: var(--muted); }
        .rank-score {
            font-weight: 800;
            font-size: 15px;
            color: var(--primary);
            font-family: 'Inter', sans-serif;
        }
        .streak-badge {
            font-size: 12px;
            background: #fff3bf;
            color: #c77c00;
            padding: 2px 7px;
            border-radius: 8px;
            font-weight: 700;
        }

        /* 개인 조회 */
        .search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .search-row input {
            flex: 1;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Noto Sans KR', sans-serif;
            outline: none;
            transition: border 0.2s;
        }
        .search-row input:focus { border-color: var(--primary); }
        .search-row button {
            padding: 0 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 달력 히트맵 */
        .heatmap-wrap {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 8px;
        }
        .hmap-day {
            aspect-ratio: 1;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            cursor: default;
        }
        .hmap-absent { background: #ffe3e3; color: #c92a2a; }
        .hmap-perfect { background: #d3f9d8; color: #2f9e44; }
        .hmap-late { background: #fff3bf; color: #c77c00; }
        .hmap-excuse { background: #d0ebff; color: #1971c2; }
        .hmap-future { background: #f1f3f5; color: #ced4da; }

        /* 요약 스탯 */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .stat-box {
            background: white;
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
        }
        .stat-val {
            font-size: 24px;
            font-weight: 900;
            font-family: 'Inter', sans-serif;
            color: var(--primary);
        }
        .stat-lbl {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* 부서별 현황 */
        .dept-member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .dept-member-item:last-child { border-bottom: none; }

        /* PC 로그인 */
        #pc-login-screen {
            display: none;
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        #pc-login-screen h2 { font-size: 22px; font-weight: 900; color: var(--primary); margin-bottom: 8px; }
        #pc-login-screen p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
        #pc-access-code {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 14px;
            outline: none;
            font-family: 'Noto Sans KR', sans-serif;
            text-align: center;
            letter-spacing: 4px;
        }
        #pc-access-code:focus { border-color: var(--primary); }

        /* 간단 모달 (사유제출) */
        .simple-modal-content {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 28px 24px;
            width: 88%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .simple-modal-content h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
        .simple-modal-content p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
        .simple-modal-content select { margin-bottom: 14px; }

        /* 스켈레톤 */
        .skeleton {
            background: linear-gradient(90deg, #f0f4ff 25%, #e2e8f0 50%, #f0f4ff 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
        .empty-state p { font-size: 14px; }

        /* 진행 바 */
        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), #748ffc);
            transition: width 0.6s ease;
        }
    </style>
</head>
<body>

<!-- PC 로그인 -->
<div id="pc-login-screen">
    <h2>💻 PC 관리자 접속</h2>
    <p>비밀번호를 입력해주세요.</p>
    <input type="password" id="pc-access-code" placeholder="••••">
    <button class="btn-primary" onclick="checkPcLogin()">접속하기</button>
</div>

<!-- 메인 앱 -->
<div id="main-app" class="container" style="display:none;">
    <div class="app-header">
        <div class="church-icon">⛪</div>
        <h2>주일 말씀 출석부</h2>
    </div>

    <!-- 시계 카드 -->
    <div class="clock-card">
        <div id="live-clock">00:00:00</div>
        <div id="time-msg" class="time-no">시간 확인 중...</div>
        <div id="gps-msg">위치 확인 중...</div>
    </div>

    <!-- 부서/이름 선택 -->
    <div class="input-card">
        <div class="input-row">
            <div class="input-col">
                <span class="input-label">부서</span>
                <select id="dept-select" onchange="loadNames()">
                    <option value="">선택</option>
                </select>
            </div>
            <div class="input-col">
                <span class="input-label">이름</span>
                <select id="name-select" disabled>
                    <option value="">부서 먼저</option>
                </select>
            </div>
        </div>
    </div>

    <button id="attend-btn" class="btn-primary" onclick="handleAttendance('attend')" disabled>
        출석체크 하기
    </button>
    <button class="btn-link" onclick="openExcuseModal()">못 오셨나요? 사유 제출하기</button>

    <button class="btn-outline" onclick="openStats()">
        📊 출석 현황판 보기
    </button>
</div>

<!-- 사유 제출 모달 -->
<div id="excuseModal" class="modal">
    <div class="simple-modal-content">
        <button class="close-btn" style="position:absolute; top:14px; right:14px;" onclick="closeModal('excuseModal')">✕</button>
        <h3>📝 사유 제출</h3>
        <p>참석하지 못하는 사유를 선택해 주세요.</p>
        <select id="excuse-select-popup">
            <option value="">사유를 선택하세요</option>
            <option value="출근">출근</option>
            <option value="병원">병원</option>
            <option value="경조사">경조사</option>
            <option value="전도">전도</option>
        </select>
        <button class="btn-primary" onclick="handleAttendance('excuse')">제출하기</button>
    </div>
</div>

<!-- 출석 현황판 (바텀 시트) -->
<div id="statsModal" class="modal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <div class="modal-title">📊 출석 현황판</div>
            <button class="close-btn" onclick="closeModal('statsModal')">✕</button>
        </div>

        <!-- 탭 -->
        <div class="dashboard-tabs">
            <button class="dtab active" onclick="switchDTab('dt-today', this)">📅 오늘</button>
            <button class="dtab" onclick="switchDTab('dt-dept', this)">🏛 부서별</button>
            <button class="dtab" onclick="switchDTab('dt-rank', this)">🏆 개인 순위</button>
            <button class="dtab" onclick="switchDTab('dt-history', this)">🔍 개인 조회</button>
        </div>

        <!-- ===== 패널: 오늘 ===== -->
        <div id="dt-today" class="dashboard-body" style="display:block;">
            <div class="section-card">
                <div class="section-title">
                    <span>📅 오늘 출석 명단</span>
                    <span class="count-badge" id="today-count">0명</span>
                </div>
                <div id="today-log-list">
                    <div class="skeleton" style="height:48px; margin-bottom:8px;"></div>
                    <div class="skeleton" style="height:48px; margin-bottom:8px;"></div>
                    <div class="skeleton" style="height:48px;"></div>
                </div>
            </div>
        </div>

        <!-- ===== 패널: 부서별 ===== -->
        <div id="dt-dept" class="dashboard-body" style="display:none;">
            <div class="section-card">
                <div class="section-title">📈 부서별 평균 출석 점수</div>
                <div class="quarter-row" id="dept-quarter-row">
                    <button class="q-chip active" onclick="changeDeptQ('all', this)">전체</button>
                    <button class="q-chip" onclick="changeDeptQ('q1', this)">1분기</button>
                    <button class="q-chip" onclick="changeDeptQ('q2', this)">2분기</button>
                    <button class="q-chip" onclick="changeDeptQ('q3', this)">3분기</button>
                    <button class="q-chip" onclick="changeDeptQ('q4', this)">4분기</button>
                </div>
                <div class="chart-wrap"><canvas id="deptChart"></canvas></div>
            </div>

            <!-- 부서별 멤버 현황 -->
            <div class="section-card">
                <div class="section-title">🏛 부서별 오늘 참석 현황</div>
                <div id="dept-member-list">
                    <div class="skeleton" style="height:40px; margin-bottom:8px;"></div>
                    <div class="skeleton" style="height:40px;"></div>
                </div>
            </div>
        </div>

        <!-- ===== 패널: 개인 순위 ===== -->
        <div id="dt-rank" class="dashboard-body" style="display:none;">
            <div class="section-card">
                <div class="section-title">🏆 출석 우수자 (평균 점수)</div>
                <div class="quarter-row">
                    <button class="q-chip active" onclick="filterRank('all', this)">전체</button>
                    <button class="q-chip" onclick="filterRank('q1', this)">1분기</button>
                    <button class="q-chip" onclick="filterRank('q2', this)">2분기</button>
                    <button class="q-chip" onclick="filterRank('q3', this)">3분기</button>
                    <button class="q-chip" onclick="filterRank('q4', this)">4분기</button>
                </div>
                <div id="rank-list">
                    <div class="skeleton" style="height:50px; margin-bottom:8px;"></div>
                    <div class="skeleton" style="height:50px; margin-bottom:8px;"></div>
                    <div class="skeleton" style="height:50px;"></div>
                </div>
            </div>
        </div>

        <!-- ===== 패널: 개인 조회 ===== -->
        <div id="dt-history" class="dashboard-body" style="display:none;">
            <div class="search-row">
                <input type="text" id="history-search-input" placeholder="이름 검색 (예: 홍길동)"
                       onkeyup="if(event.key==='Enter') searchHistory()">
                <button onclick="searchHistory()">검색</button>
            </div>
            <div id="history-result">
                <div class="empty-state">
                    <div class="icon">🔍</div>
                    <p>이름을 입력하고 검색하면<br>출석 기록이 나타납니다.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== 설정 =====
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzklpaIk25KJeltzEtXTFm0YKNQyXKSWrcyDPqUiNFj_5gn6ISdRowyq8MvoXhxfInm/exec";
    const TARGET_LAT = 37.192984;
    const TARGET_LON = 127.059825;
    const ALLOWED_RADIUS = 300;
    const PC_ACCESS_PASSWORD = "1324";
    // ================

    let membersData = [];
    let fullHistoryData = [];
    let isLocationValid = false;
    let isTimeValid = false;
    let isAdminMode = false;
    let deptChart = null;
    let allLogsCache = [];
    let deptStatsCache = [];
    let todayListCache = [];
    let currentDeptQ = 'all';

    // ---- 초기화 ----
    window.onload = function () {
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            initApp();
        } else {
            document.getElementById('pc-login-screen').style.display = 'block';
            document.getElementById("pc-access-code").addEventListener("keyup", e => { if (e.key === "Enter") checkPcLogin(); });
        }
    };

    function checkPcLogin() {
        if (document.getElementById('pc-access-code').value === PC_ACCESS_PASSWORD) {
            document.getElementById('pc-login-screen').style.display = 'none';
            isAdminMode = true;
            initApp();
        } else { alert("비밀번호가 틀렸습니다."); }
    }

    function initApp() {
        document.getElementById('main-app').style.display = 'block';
        fetchMembers();
        setInterval(updateClockAndStatus, 1000);
        updateClockAndStatus();
        if (isAdminMode) {
            isLocationValid = true;
            document.getElementById('gps-msg').innerHTML = '🔧 관리자 모드 (위치 PASS)';
            checkButtons();
        } else { checkLocation(); }
    }

    function updateClockAndStatus() {
        const now = new Date();
        const day = now.getDay();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });
        const currentMin = now.getHours() * 60 + now.getMinutes();
        const startMin = 8 * 60, endMin = 10 * 60;
        const msgEl = document.getElementById('time-msg');
        if (isAdminMode) {
            isTimeValid = true;
            msgEl.textContent = '🔧 관리자 모드';
            msgEl.className = 'time-admin';
        } else if (day === 0 && currentMin >= startMin && currentMin < endMin) {
            isTimeValid = true;
            msgEl.textContent = '✅ 출석 체크 가능 (08:00 ~ 10:00)';
            msgEl.className = 'time-ok';
        } else {
            isTimeValid = false;
            msgEl.textContent = day !== 0 ? '⛔ 주일이 아닙니다' : '⛔ 출석 시간이 아닙니다 (08~10시)';
            msgEl.className = 'time-no';
        }
        checkButtons();
    }

    function checkLocation() {
        const gpsEl = document.getElementById('gps-msg');
        if (!navigator.geolocation) return;
        navigator.geolocation.watchPosition(pos => {
            const dist = getDistance(pos.coords.latitude, pos.coords.longitude, TARGET_LAT, TARGET_LON);
            if (dist <= ALLOWED_RADIUS) {
                isLocationValid = true;
                gpsEl.textContent = `📍 위치 인증 완료 (${Math.round(dist)}m)`;
            } else {
                isLocationValid = false;
                gpsEl.textContent = `⚠️ 거리 벗어남 (${Math.round(dist)}m)`;
            }
            checkButtons();
        }, () => {
            isLocationValid = false;
            gpsEl.textContent = '⚠️ GPS 확인 불가 - 수동 체크 가능';
            checkButtons();
        }, { enableHighAccuracy: true });
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1000;
    }

    function fetchMembers() {
        fetch(GAS_URL + "?action=getMembers").then(r => r.json()).then(data => {
            membersData = data;
            const depts = [...new Set(data.map(r => r[0]))];
            const sel = document.getElementById('dept-select');
            depts.forEach(d => { const o = document.createElement('option'); o.value = d; o.text = d; sel.appendChild(o); });
        });
    }

    function loadNames() {
        const dept = document.getElementById('dept-select').value;
        const sel = document.getElementById('name-select');
        sel.innerHTML = '<option value="">이름 선택</option>';
        sel.disabled = false;
        membersData.filter(r => r[0] === dept).forEach(r => {
            const o = document.createElement('option'); o.value = r[1]; o.text = r[1]; sel.appendChild(o);
        });
        checkButtons();
    }

    function checkButtons() {
        const btn = document.getElementById('attend-btn');
        const lastTime = localStorage.getItem("last_submit_time");
        if (lastTime && !isAdminMode) {
            const diff = new Date().getTime() - parseInt(lastTime);
            if (diff < 10 * 60 * 1000) {
                btn.disabled = true;
                btn.innerText = `제출 완료 (${Math.ceil((600000 - diff) / 60000)}분 대기)`;
                return;
            }
        }
        btn.innerText = "출석체크 하기";
        btn.disabled = !(document.getElementById('name-select').value && isTimeValid);
    }

    function handleAttendance(type) {
        const dept = document.getElementById('dept-select').value;
        const name = document.getElementById('name-select').value;
        if (!dept || !name) { alert("부서와 이름을 선택하세요."); return; }

        if (type === 'attend') {
            if (!isTimeValid && !isAdminMode) { alert("출석 체크 시간(08:00~10:00)이 아닙니다."); return; }
            if (!isLocationValid && !isAdminMode) {
                if (!confirm("⚠️ 위치가 교회와 멉니다.\n교회에 계신가요? (확인 시 출석 처리)")) return;
            }
            const now = new Date();
            const hour = now.getHours(), min = now.getMinutes();
            let note = "정상출석", score = 100;
            if (hour === 9) { note = "지각"; score = 91 - min; }
            else if (hour !== 8) { note = "기타"; score = 0; }

            let msg = `[${dept} - ${name}] 출석하시겠습니까?\n`;
            msg += note === "지각"
                ? `\n⚠️ 09시 넘어 지각 처리 (예상 ${score}점)`
                : `\n✅ 정상출석 (100점)`;
            if (!confirm(msg)) return;
            sendData(dept, name, note, score, type);
        } else {
            const reason = document.getElementById('excuse-select-popup').value;
            if (!reason) { alert("사유를 선택하세요."); return; }
            if (!confirm(`[${reason}] 사유로 제출하시겠습니까?`)) return;
            sendData(dept, name, reason, 0, type);
        }
    }

    function sendData(dept, name, note, score, type) {
        const btn = document.getElementById('attend-btn');
        if (btn.dataset.submitting === "true") return;
        btn.dataset.submitting = "true";
        btn.disabled = true; btn.innerText = "전송 중...";
        fetch(GAS_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dept, name, note, score })
        }).then(() => {
            if (type === 'attend') fireConfetti();
            setTimeout(() => {
                alert(type === 'attend' ? `🎉 [${name}]님 출석 완료! (${note}, ${score}점)` : `✅ 사유 제출 완료!`);
                localStorage.setItem("last_submit_time", new Date().getTime());
                location.reload();
            }, 1000);
        }).catch(() => { alert("전송 실패. 관리자에게 문의하세요."); btn.disabled = false; });
    }

    // ===== 현황판 탭 =====
    function openStats() {
        document.getElementById('statsModal').style.display = "block";
        loadStatsData();
    }

    function switchDTab(tabId, btn) {
        document.querySelectorAll('.dashboard-body').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.dtab').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).style.display = 'block';
        btn.classList.add('active');
    }

    function loadStatsData() {
        fetch(GAS_URL + "?action=getStats")
            .then(r => r.json())
            .then(data => {
                allLogsCache = data.allLogs || [];
                deptStatsCache = data.deptStats || [];
                todayListCache = data.todayList || [];
                fullHistoryData = allLogsCache;

                renderToday(data.todayList || []);
                drawDeptChart(deptStatsCache, 'all');
                renderDeptMembers(data.todayList || []);
                renderRank('all');
            })
            .catch(err => console.error("loadStatsData 오류:", err));
    }

    // ===== 오늘 명단 =====
    function renderToday(list) {
        const wrap = document.getElementById('today-log-list');
        document.getElementById('today-count').textContent = list.length + '명';
        if (list.length === 0) {
            wrap.innerHTML = '<div class="empty-state"><div class="icon">🙏</div><p>아직 출석자가 없습니다.</p></div>';
            return;
        }
        wrap.innerHTML = list.map(log => {
            let badgeClass = 'badge-ok', noteText = log.note || '출석';
            if (log.note === '지각') badgeClass = 'badge-warn';
            else if (log.note === '결석') badgeClass = 'badge-danger';
            else if (!['정상출석', '정상'].includes(log.note)) badgeClass = 'badge-info';
            const initial = log.name ? log.name[0] : '?';
            return `<div class="today-item">
                <div class="avatar">${initial}</div>
                <div style="flex:1">
                    <div class="today-name">${log.name}</div>
                    <div class="today-meta">${log.dept} · ${log.time}</div>
                </div>
                <span class="badge ${badgeClass}">${noteText}</span>
            </div>`;
        }).join('');
    }

    // ===== 부서별 차트 (분기 지원) =====
    function changeDeptQ(q, btn) {
        currentDeptQ = q;
        document.querySelectorAll('#dept-quarter-row .q-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const months = getQuarterMonths(q);

        // 분기별로 allLogs에서 재계산
        if (q === 'all') {
            drawDeptChart(deptStatsCache, q);
            return;
        }

        // 분기별 통계 재계산
        const sundays = getSundaysUntilNow().filter(d => {
            const m = parseInt(d.split('-')[1]);
            return months.includes(m);
        });
        const sundaySet = new Set(sundays);

        // 부서별 재적
        const deptTotal = {};
        membersData.forEach(r => {
            const d = r[0];
            if (!deptTotal[d]) deptTotal[d] = 0;
            deptTotal[d]++;
        });

        const deptScoreSum = {}, deptDateSet = {};
        allLogsCache.forEach(log => {
            if (!sundaySet.has(log.date)) return;
            const score = parseInt(log.score) || 0;
            if (!deptScoreSum[log.dept]) { deptScoreSum[log.dept] = 0; deptDateSet[log.dept] = new Set(); }
            deptScoreSum[log.dept] += score;
            deptDateSet[log.dept].add(log.date);
        });

        const stats = Object.keys(deptScoreSum).map(d => {
            const mc = deptTotal[d] || 1;
            const sc = deptDateSet[d].size;
            return { dept: d, rate: sc > 0 ? Math.round(deptScoreSum[d] / (mc * sc)) : 0 };
        }).sort((a, b) => b.rate - a.rate);

        drawDeptChart(stats, q);
    }

    function drawDeptChart(stats, q) {
        const ctx = document.getElementById('deptChart').getContext('2d');
        if (deptChart) deptChart.destroy();
        const colors = ['#4c6ef5','#3bc9db','#69db7c','#ffd43b','#ff6b6b','#cc5de8','#fd7e14'];
        deptChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: stats.map(d => d.dept),
                datasets: [{
                    data: stats.map(d => d.rate),
                    backgroundColor: stats.map((_, i) => colors[i % colors.length] + 'cc'),
                    borderRadius: 8,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, max: 100, grid: { color: '#f0f0f0' }, ticks: { font: { size: 11 } } },
                    x: { ticks: { font: { size: 12, weight: '700' } } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    // ===== 부서별 오늘 참석 현황 =====
    function renderDeptMembers(todayList) {
        const wrap = document.getElementById('dept-member-list');
        const todayNames = new Set(todayList.map(l => l.name));

        // 부서별 집계
        const deptMap = {};
        membersData.forEach(r => {
            const dept = r[0], name = r[1];
            if (!deptMap[dept]) deptMap[dept] = { total: 0, present: 0 };
            deptMap[dept].total++;
            if (todayNames.has(name)) deptMap[dept].present++;
        });

        const rows = Object.entries(deptMap).sort((a, b) => (b[1].present / b[1].total) - (a[1].present / a[1].total));
        wrap.innerHTML = rows.map(([dept, d]) => {
            const pct = Math.round((d.present / d.total) * 100);
            const barColor = pct >= 80 ? '#2f9e44' : pct >= 50 ? '#e67700' : '#c92a2a';
            return `<div class="dept-member-item" style="flex-direction:column; align-items:stretch; padding:10px 0;">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span style="font-weight:700; font-size:13px;">${dept}</span>
                    <span style="font-size:12px; color:var(--muted);">${d.present} / ${d.total}명 (${pct}%)</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width:${pct}%; background:${barColor};"></div>
                </div>
            </div>`;
        }).join('');
    }

    // ===== 개인 순위 =====
    function getSundaysUntilNow() {
        const now = new Date();
        let d = new Date(now.getFullYear(), 0, 1);
        while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
        const sundays = [];
        while (d <= now) {
            sundays.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
            d.setDate(d.getDate() + 7);
        }
        return sundays;
    }

    function getQuarterMonths(q) {
        return { q1:[1,2,3], q2:[4,5,6], q3:[7,8,9], q4:[10,11,12] }[q] || null;
    }

    function renderRank(q) {
        const rankDiv = document.getElementById('rank-list');
        const months = getQuarterMonths(q);
        const logs = allLogsCache;
        const allSundays = getSundaysUntilNow().filter(d => {
            if (!months) return true;
            return months.includes(parseInt(d.split('-')[1]));
        });
        if (allSundays.length === 0) {
            rankDiv.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>해당 분기 데이터가 없습니다.</p></div>';
            return;
        }
        const sundaySet = new Set(allSundays);

        // 날짜||이름 → 최고점
        const logMap = {};
        logs.forEach(log => {
            if (!sundaySet.has(log.date)) return;
            const key = log.date + '||' + log.name;
            const sc = parseInt(log.score) || 0;
            if (logMap[key] === undefined || sc > logMap[key]) logMap[key] = sc;
        });

        // 멤버별 합산
        const memberMap = {};
        membersData.forEach(r => {
            memberMap[r[1] + '||' + r[0]] = { name: r[1], dept: r[0], total: 0, streak: 0 };
        });

        allSundays.forEach(sunday => {
            Object.entries(memberMap).forEach(([mKey, m]) => {
                const lKey = sunday + '||' + m.name;
                memberMap[mKey].total += (logMap[lKey] !== undefined ? logMap[lKey] : 0);
            });
        });

        // 연속 출석 계산 (최근 기준)
        Object.values(memberMap).forEach(m => {
            let streak = 0;
            for (let i = allSundays.length - 1; i >= 0; i--) {
                const logKey = allSundays[i] + '||' + m.name;
                const matchedLog = allLogsCache.find(l => l.date === allSundays[i] && l.name === m.name);
                const note = matchedLog ? matchedLog.note : null;
                const validStreak = note === '정상출석' || note === '전도';
                if (validStreak) streak++;
                else break;
            }
            m.streak = streak;
        });

        const ranked = Object.values(memberMap)
            .map(p => ({ ...p, avg: Math.round(p.total / allSundays.length) }))
            .sort((a, b) => b.avg - a.avg).slice(0, 20);

        rankDiv.innerHTML = ranked.map((p, i) => {
            const medals = ['🥇','🥈','🥉'];
            const numClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
            const num = medals[i] || `${i+1}`;
            const streakHtml = p.streak >= 3 ? `<span class="streak-badge">🔥 ${p.streak}주 연속</span>` : '';
            return `<div class="rank-item">
                <div class="rank-num ${numClass}">${num}</div>
                <div class="rank-info">
                    <div class="rank-name">${p.name} ${streakHtml}</div>
                    <div class="rank-dept">${p.dept}</div>
                </div>
                <div class="rank-score">${p.avg}점</div>
            </div>`;
        }).join('');
    }

    function filterRank(q, btn) {
        document.querySelectorAll('#dt-rank .q-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderRank(q);
    }

    // ===== 개인 조회 (히트맵 포함) =====
    function searchHistory() {
        const input = document.getElementById('history-search-input').value.trim();
        const resultDiv = document.getElementById('history-result');
        if (input.length < 2) { alert("이름을 2글자 이상 입력하세요."); return; }
        if (fullHistoryData.length === 0) { alert("데이터가 없습니다. 잠시 후 다시 시도하세요."); return; }

        const userLogs = fullHistoryData.filter(log => log.name.includes(input));
        const logMap = {};
        userLogs.forEach(log => { logMap[log.date] = log; });

        const allSundays = getSundaysUntilNow();
        const deptName = userLogs.length > 0 ? userLogs[0].dept : '-';

        const finalHistory = allSundays.map(sd => logMap[sd] || { date: sd, time: '-', name: input, dept: deptName, note: '결석', score: 0 });

        // 통계
        const total = finalHistory.length;
        const presentCount = finalHistory.filter(l => l.note !== '결석').length;
        const absentCount = total - presentCount;
        const lateCount = finalHistory.filter(l => l.note === '지각').length;
        const avgScore = total > 0 ? Math.round(finalHistory.reduce((s, l) => s + (parseInt(l.score) || 0), 0) / total) : 0;

        // 연속 출석
        let streak = 0;
        for (let i = finalHistory.length - 1; i >= 0; i--) {
            if (finalHistory[i].note !== '결석' && finalHistory[i].note !== '') streak++;
            else break;
        }

        resultDiv.innerHTML = `
            <div style="font-weight:900; font-size:16px; color:var(--primary); margin-bottom:12px;">${input}님의 출석부 <span style="font-size:13px; color:var(--muted); font-weight:400;">(${deptName})</span></div>

            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-val">${presentCount}</div>
                    <div class="stat-lbl">출석 횟수</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" style="color:#c92a2a;">${absentCount}</div>
                    <div class="stat-lbl">결석 횟수</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val">${avgScore}</div>
                    <div class="stat-lbl">평균 점수</div>
                </div>
            </div>

            ${streak >= 2 ? `<div style="background:#fff3bf; color:#c77c00; border-radius:10px; padding:10px 14px; font-weight:700; font-size:13px; margin-bottom:12px;">🔥 현재 ${streak}주 연속 출석 중!</div>` : ''}

            <div class="section-card" style="margin-bottom:14px;">
                <div class="section-title">📆 출석 히트맵 (올해)</div>
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:8px;">
                    <span style="font-size:11px; color:var(--muted);">
                        <span style="display:inline-block;width:12px;height:12px;background:#d3f9d8;border-radius:3px;vertical-align:middle;"></span> 정상
                        <span style="display:inline-block;width:12px;height:12px;background:#fff3bf;border-radius:3px;vertical-align:middle; margin-left:6px;"></span> 지각
                        <span style="display:inline-block;width:12px;height:12px;background:#d0ebff;border-radius:3px;vertical-align:middle; margin-left:6px;"></span> 사유
                        <span style="display:inline-block;width:12px;height:12px;background:#ffe3e3;border-radius:3px;vertical-align:middle; margin-left:6px;"></span> 결석
                    </span>
                </div>
                <div class="heatmap-wrap">
                    ${finalHistory.map(l => {
                        let cls = 'hmap-absent', label = '✗';
                        if (l.note === '정상출석' || l.note === '정상') { cls = 'hmap-perfect'; label = '✓'; }
                        else if (l.note === '지각') { cls = 'hmap-late'; label = '△'; }
                        else if (l.note !== '결석') { cls = 'hmap-excuse'; label = '○'; }
                        const shortDate = l.date.slice(5); // MM-DD
                        return `<div class="hmap-day ${cls}" title="${l.date} ${l.note}">${shortDate}</div>`;
                    }).join('')}
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">📋 상세 기록</div>
                ${[...finalHistory].reverse().map(log => {
                    let badge = 'badge-ok';
                    if (log.note === '지각') badge = 'badge-warn';
                    else if (log.note === '결석') badge = 'badge-danger';
                    else if (!['정상출석','정상'].includes(log.note)) badge = 'badge-info';
                    return `<div class="today-item">
                        <div style="flex:1; font-size:13px; font-weight:600; color:var(--text);">${log.date}</div>
                        <div style="font-size:12px; color:var(--muted); margin-right:10px;">${log.time !== '-' ? log.time : ''}</div>
                        <span class="badge ${badge}">${log.note}</span>
                    </div>`;
                }).join('')}
            </div>`;
    }

    // ===== 유틸 =====
    function closeModal(id) { document.getElementById(id).style.display = "none"; }
    function openExcuseModal() {
        if (!document.getElementById('name-select').value) { alert("이름을 먼저 선택하세요."); return; }
        document.getElementById('excuseModal').style.display = "block";
    }
    window.onclick = function (e) { if (e.target.classList.contains('modal')) e.target.style.display = "none"; };

    function fireConfetti() {
        const end = Date.now() + 1000;
        (function frame() {
            confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
            confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }
</script>
</body>
</html>
