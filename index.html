<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주일 말씀 출석부</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --primary: #007bff; --bg-light: #f8f9fa; --text-dark: #333; }
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background-color: #f0f2f5; padding: 20px; text-align: center; color: var(--text-dark); -webkit-font-smoothing: antialiased; }
        
        /* 메인 컨테이너 */
        .container { max-width: 450px; margin: 0 auto; background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        
        h2 { margin: 0 0 15px 0; color: #2c3e50; font-size: 22px; font-weight: 700; }
        
        /* 시계 및 상태 */
        #live-clock { font-size: 32px; font-weight: 800; color: #333; margin-bottom: 5px; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
        .status-msg { margin: 10px 0 15px 0; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 20px; display: inline-block; width: 100%; box-sizing: border-box;}
        .gps-status { font-size: 12px; color: #888; margin-bottom: 15px; display: block; }
        
        .ok-msg { background-color: #e8f5e9; color: #2e7d32; }
        .no-msg { background-color: #ffebee; color: #c62828; }
        .test-msg { background-color: #fff8e1; color: #f57f17; }
        .gps-ok { color: #2e7d32; font-weight: bold; }
        .gps-no { color: #c62828; font-weight: bold; }

        /* 입력 폼 */
        .input-group { text-align: left; margin-top: 20px; background: var(--bg-light); padding: 15px; border-radius: 12px; }
        label { font-size: 12px; color: #666; font-weight: 600; margin-left: 4px; display: block; margin-bottom: 4px;}
        select, input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-bottom: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ddd; background-color: white; outline: none; box-sizing: border-box; transition: 0.2s; }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }

        /* 버튼 스타일 */
        .main-btn { width: 100%; padding: 16px; font-size: 17px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; color: white; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,123,255,0.2); }
        #attend-btn { background: linear-gradient(135deg, #007bff, #0056b3); }
        #attend-btn:active { transform: scale(0.98); }
        #attend-btn:disabled { background: #e0e0e0; color:#999; cursor: not-allowed; box-shadow: none; }
        
        .sub-btn { background: white; border: 1px solid #ddd; color: #555; padding: 12px; border-radius: 10px; width: 100%; margin-top: 10px; font-weight: 600; cursor: pointer; }
        .link-btn { background: none; border: none; color: #888; text-decoration: underline; font-size: 13px; margin-top: 15px; cursor: pointer; padding: 5px; }

        /* 모달 (팝업) & 탭 UI */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .modal-content { background-color: white; margin: 5% auto; padding: 0; width: 92%; max-width: 420px; border-radius: 16px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden; height: 85vh; display: flex; flex-direction: column; }
        
        .modal-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; }
        .modal-header h3 { margin: 0; font-size: 18px; }
        .close-btn { font-size: 24px; cursor: pointer; color: #aaa; padding: 5px; }

        /* 탭 네비게이션 */
        .tabs { display: flex; background: #f1f3f5; padding: 4px; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; cursor: pointer; font-weight: 600; color: #777; font-size: 14px; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* 탭 내용 영역 */
        .tab-content { display: none; padding: 20px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* 테이블 및 리스트 */
        .log-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        .log-table th { background: #f8f9fa; padding: 10px; border-bottom: 1px solid #ddd; color: #555; position: sticky; top: 0; }
        .log-table td { padding: 10px; border-bottom: 1px solid #eee; color: #333; }
        
        /* 순위 리스트 스타일 */
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f0f0f0; }
        .rank-medal { width: 24px; text-align: center; font-size: 18px; margin-right: 10px; }
        .rank-name { font-weight: bold; flex: 1; text-align: left; }
        .rank-score { color: var(--primary); font-weight: 700; }

        /* 배지 스타일 */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; color: white; display: inline-block; min-width: 40px; white-space: nowrap;}
        .bg-ok { background-color: #28a745; }
        .bg-warn { background-color: #ff9800; }
        .bg-no { background-color: #ffc107; color: #333; }
        .bg-info { background-color: #17a2b8; }
        .bg-danger { background-color: #dc3545; }

        /* 검색 영역 */
        .search-box { display: flex; gap: 5px; margin-bottom: 15px; }
        .search-box input { margin: 0; flex: 1; }
        .search-box button { padding: 0 15px; border-radius: 8px; background: #6c757d; color: white; border: none; font-weight: bold; cursor: pointer; }

        /* PC 로그인 */
        #pc-login-screen { display: none; max-width: 400px; margin: 50px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .quarter-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .q-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 13px; font-weight: 600; color: #666; }
        .q-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    </style>
</head>
<body>

<div id="pc-login-screen">
    <h2>💻 PC 관리자 접속</h2>
    <p style="color:#666; font-size:14px; margin-bottom:20px;">비밀번호를 입력해주세요.</p>
    <input type="password" id="pc-access-code" placeholder="비밀번호">
    <button class="main-btn" style="background:#28a745;" onclick="checkPcLogin()">접속하기</button>
</div>

<div id="main-app" class="container" style="display:none;">
    <h2>⛪ 주일 말씀 출석부</h2>
    
    <div id="live-clock">00:00:00</div>
    <div id="time-msg" class="status-msg no-msg">시간 확인 중...</div>
    <div id="gps-msg" class="gps-status">위치 확인 중...</div>

    <div class="input-group">
        <label>부서 선택</label>
        <select id="dept-select" onchange="loadNames()"><option value="">부서 선택</option></select>
        
        <label>이름 선택</label>
        <select id="name-select" disabled><option value="">부서를 먼저 선택하세요</option></select>
    </div>

    <button id="attend-btn" class="main-btn" onclick="handleAttendance('attend')" disabled>출석체크 하기</button>
    <button class="link-btn" onclick="openExcuseModal()">혹시 못 오셨나요? 사유 제출하기</button>

    <button class="sub-btn" style="background-color: #f1f3f5; color: #333;" onclick="openStats()">
        📊 현황 및 기록 조회
    </button>
</div>

<div id="excuseModal" class="modal">
    <div class="modal-content" style="height: auto; padding: 25px;">
        <span class="close-btn" style="position: absolute; top: 10px; right: 15px;" onclick="closeModal('excuseModal')">&times;</span>
        <h3 style="margin-top:0;">📝 사유 제출</h3>
        <p style="font-size:14px; color:#666; margin-bottom:15px;">참석하지 못하는 사유를 선택해 주세요.</p>
        <select id="excuse-select-popup">
            <option value="">사유를 선택하세요</option>
            <option value="출근">출근</option>
            <option value="병원">병원</option>
            <option value="경조사">경조사</option>
            <option value="전도">전도</option>
        </select>
        <button class="main-btn" style="background-color:#6c757d;" onclick="handleAttendance('excuse')">제출하기</button>
    </div>
</div>

<div id="statsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📊 출석 현황판</h3>
            <span class="close-btn" onclick="closeModal('statsModal')">&times;</span>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-today')">오늘 명단</button>
            <button class="tab-btn" onclick="switchTab('tab-rank')">누적 순위</button>
            <button class="tab-btn" onclick="switchTab('tab-history')">개인 조회</button>
        </div>

        <div id="tab-today" class="tab-content active">
            <h4 style="text-align:left; margin:0 0 10px 0; font-size:14px; color:#555;">📅 오늘 출석 현황</h4>
            <div style="border: 1px solid #eee; border-radius: 8px; overflow: hidden;">
                <table class="log-table">
                    <thead><tr><th width="20%">시간</th><th>이름</th><th width="20%">부서</th><th width="20%">상태</th></tr></thead>
                    <tbody id="today-log-list"><tr><td colspan="4">로딩 중...</td></tr></tbody>
                </table>
            </div>
            
            <hr style="border:0; border-top:1px solid #eee; margin: 20px 0;">
            
            <h4 style="text-align:left; margin:0 0 10px 0; font-size:14px; color:#555;">📈 부서별 평균 출석률 (누적)</h4>
            <div style="height: 200px;"><canvas id="deptChart"></canvas></div>
        </div>

        <div id="tab-rank" class="tab-content">
            <h4 style="text-align:left; margin:0 0 10px 0; font-size:14px; color:#555;">🏆 출석 우수자 (평균 점수)</h4>
            <div class="quarter-tabs">
                <button class="q-btn active" onclick="filterRank('all', this)">전체</button>
                <button class="q-btn" onclick="filterRank('q1', this)">1분기 (1~3월)</button>
                <button class="q-btn" onclick="filterRank('q2', this)">2분기 (4~6월)</button>
                <button class="q-btn" onclick="filterRank('q3', this)">3분기 (7~9월)</button>
                <button class="q-btn" onclick="filterRank('q4', this)">4분기 (10~12월)</button>
            </div>
            <div id="rank-list">로딩 중...</div>
        </div>

        <div id="tab-history" class="tab-content">
            <div class="search-box">
                <input type="text" id="history-search-input" placeholder="이름을 입력하세요 (예: 홍길동)" onkeyup="if(window.event.keyCode==13){searchHistory()}">
                <button onclick="searchHistory()">검색</button>
            </div>
            <div id="history-result">
                <p style="color:#999; font-size:13px; margin-top:30px;">이름을 입력하고 검색 버튼을 누르면<br>지난 출석 이력이 표시됩니다.</p>
            </div>
        </div>
    </div>
</div>

<script>
    // ================= [설정 영역] =================
    // ★ 주의: 아래 URL을 새로 배포한 웹앱 URL로 꼭 변경해주세요!
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxO985uedYbWRkfbXvH9UFKpr21px3dH6LzNSw1dOar1g9e7SlWpMhujBCpQpv1jkc/exec"; 
    const TARGET_LAT = 37.192984; 
    const TARGET_LON = 127.059825; 
    const ALLOWED_RADIUS = 300; 
    const PC_ACCESS_PASSWORD = "1324"; 
    // ===============================================

    let membersData = [];
    let fullHistoryData = []; 
    let isLocationValid = false; 
    let isTimeValid = false; 
    let isAdminMode = false;
    let deptChart = null;

    // 초기 실행
    window.onload = function() {
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            initApp();
        } else {
            document.getElementById('pc-login-screen').style.display = 'block';
            document.getElementById("pc-access-code").addEventListener("keyup", (e) => { if (e.key === "Enter") checkPcLogin(); });
        }
    };

    function checkPcLogin() {
        if (document.getElementById('pc-access-code').value === PC_ACCESS_PASSWORD) {
            document.getElementById('pc-login-screen').style.display = 'none';
            isAdminMode = true;
            initApp();
        } else { alert("비밀번호가 틀렸습니다."); }
    }

    function initApp() {
        document.getElementById('main-app').style.display = 'block';
        fetchMembers();
        setInterval(updateClockAndStatus, 1000);
        updateClockAndStatus();
        if (isAdminMode) {
            isLocationValid = true;
            document.getElementById('gps-msg').innerHTML = `<span class="gps-ok">🔧 관리자 모드 (위치 PASS)</span>`;
            checkButtons();
        } else { checkLocation(); }
    }

    function updateClockAndStatus() {
        const now = new Date();
        const day = now.getDay(); 
        document.getElementById('live-clock').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });
        
        const isSunday = (day === 0);
        const currentMin = now.getHours() * 60 + now.getMinutes();
        
        // -----------------------------------------------------------
        // [설정] 08:00 ~ 10:00 까지만 가능 (10시 0분 0초 되면 닫힘)
        // -----------------------------------------------------------
        const startMin = 8 * 60; 
        const endMin = 10 * 60; 

        const msgBox = document.getElementById('time-msg');

        if (isAdminMode) {
            isTimeValid = true;
            msgBox.innerHTML = "🔧 관리자 모드"; msgBox.className = "status-msg test-msg";
        } else if (isSunday && currentMin >= startMin && currentMin < endMin) {
            isTimeValid = true;
            msgBox.innerHTML = "✅ 출석 체크 가능 (08:00 ~ 10:00)"; msgBox.className = "status-msg ok-msg";
        } else {
            isTimeValid = false;
            msgBox.innerHTML = !isSunday ? "⛔ 주일이 아닙니다" : "⛔ 출석 시간이 아닙니다 (08~10시)";
            msgBox.className = "status-msg no-msg";
        }
        checkButtons();
    }

    function checkLocation() {
        const gpsMsg = document.getElementById('gps-msg');
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                const dist = getDistanceFromLatLonInMeters(position.coords.latitude, position.coords.longitude, TARGET_LAT, TARGET_LON);
                if (dist <= ALLOWED_RADIUS) {
                    isLocationValid = true;
                    gpsMsg.innerHTML = `<span class="gps-ok">📍 위치 인증 완료 (${Math.round(dist)}m)</span>`;
                } else {
                    isLocationValid = false;
                    gpsMsg.innerHTML = `<span class="gps-no">⚠️ 거리 벗어남 (${Math.round(dist)}m) - 수동 체크 가능</span>`;
                }
                checkButtons();
            }, () => { 
                isLocationValid = false; 
                gpsMsg.innerHTML = `<span class="gps-no">⚠️ GPS 확인 불가 - 수동 체크 가능</span>`;
                checkButtons(); 
            }, { enableHighAccuracy: true });
        }
    }
    
    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
        const R = 6371; const dLat = deg2rad(lat2-lat1); const dLon = deg2rad(lon2-lon1);
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) * 1000;
    }
    function deg2rad(deg) { return deg * (Math.PI/180); }

    function fetchMembers() {
        fetch(GAS_URL + "?action=getMembers").then(res => res.json()).then(data => {
            membersData = data; 
            const depts = [...new Set(data.map(item => item[0]))];
            const deptSelect = document.getElementById('dept-select');
            depts.forEach(d => { let opt = document.createElement('option'); opt.value = d; opt.text = d; deptSelect.appendChild(opt); });
        });
    }

    function loadNames() {
        const dept = document.getElementById('dept-select').value;
        const nameSelect = document.getElementById('name-select');
        nameSelect.innerHTML = '<option value="">이름을 선택하세요</option>';
        nameSelect.disabled = false;
        membersData.filter(r => r[0] === dept).forEach(r => {
            let opt = document.createElement('option'); opt.value = r[1]; opt.text = r[1]; nameSelect.appendChild(opt);
        });
        checkButtons();
    }

    function checkButtons() {
        const attendBtn = document.getElementById('attend-btn');
        const lastTime = localStorage.getItem("last_submit_time");
        if (lastTime && !isAdminMode) {
            const diff = new Date().getTime() - parseInt(lastTime);
            if (diff < 10 * 60 * 1000) {
                attendBtn.disabled = true; attendBtn.innerText = `제출 완료 (${Math.ceil((600000 - diff)/60000)}분 대기)`; return;
            }
        }
        attendBtn.innerText = "출석체크 하기";
        const ready = document.getElementById('name-select').value !== "" && isTimeValid;
        attendBtn.disabled = !ready;
    }

    function handleAttendance(type) {
        const dept = document.getElementById('dept-select').value;
        const name = document.getElementById('name-select').value;
        
        // 1. 유효성 검사
        if (!dept || !name) { alert("부서와 이름을 선택하세요."); return; }
        
        if (type === 'attend') {
            if(!isTimeValid && !isAdminMode) { alert("출석 체크 시간(08:00 ~ 10:00)이 아닙니다."); return; }
            if (!isLocationValid && !isAdminMode) {
                if (!confirm("⚠️ 현재 위치가 교회와 거리가 멉니다.\n\n교회에 계신가요?\n(확인을 누르면 출석 처리됩니다)")) return;
            }

            // -------------------------------------------
            // [핵심] 시간별 점수 계산 (08시, 09시)
            // -------------------------------------------
            const now = new Date();
            const hour = now.getHours();   // 시
            const min = now.getMinutes();  // 분
            
            let note = "정상출석";
            let score = 100;

            if (hour === 8) {
                // 08:00 ~ 08:59 -> 정상
                note = "정상출석";
                score = 100;
            } else if (hour === 9) {
                // 09:00 ~ 09:59 -> 지각
                note = "지각";
                score = 91 - min; 
            } else {
                // 그 외 (관리자 등)
                note = "기타"; 
                score = 0; 
            }

            let confirmMsg = `[${dept} - ${name}] 님 출석하시겠습니까?`;
            if (note === "지각") {
                confirmMsg += `\n\n⚠️ 09시가 넘어 [지각] 처리됩니다.\n(예상 점수: ${score}점)`;
            } else {
                confirmMsg += `\n\n✅ [정상출석] 입니다.\n(점수: 100점)`;
            }

            if (!confirm(confirmMsg)) return;
            
            // 데이터 전송
            sendData(dept, name, note, score, type);

        } else {
            // 사유 제출 로직 (점수 0점)
            const reason = document.getElementById('excuse-select-popup').value;
            if (!reason) { alert("사유를 선택하세요."); return; }
            if (!confirm(`[${reason}] 사유로 제출하시겠습니까?`)) return;
            sendData(dept, name, reason, 0, type);
        }
    }

    // [데이터 전송 통합 함수]
    function sendData(dept, name, note, score, type) {
        const btn = document.getElementById('attend-btn');
        if (btn.dataset.submitting === "true") return; // 중복 방지
        btn.dataset.submitting = "true";
        btn.disabled = true; btn.innerText = "전송 중...";

        fetch(GAS_URL, { 
            method: "POST", mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dept, name, note, score }) 
        }).then(() => { 
            if(type === 'attend') fireConfetti(); 
            setTimeout(() => { 
                // 메시지 구분
                if(type === 'attend') {
                    alert(`🎉 [${name}]님 출석 체크 완료!\n(${note}, ${score}점)`); 
                } else {
                    alert(`✅ 사유 제출 완료되었습니다.`);
                }
                localStorage.setItem("last_submit_time", new Date().getTime());
                location.reload(); 
            }, 1000);
        }).catch(() => { alert("전송 실패. 관리자에게 문의하세요."); btn.disabled = false; });
    }

    // --- 탭 및 통계 관련 로직 ---

    function openStats() { 
        document.getElementById('statsModal').style.display = "block"; 
        loadStatsData(); 
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

    function loadStatsData() {
    const listBody = document.getElementById('today-log-list');
    const rankDiv = document.getElementById('rank-list');
    listBody.innerHTML = "<tr><td colspan='4'>데이터 불러오는 중...</td></tr>";

    fetch(GAS_URL + "?action=getStats")
        .then(res => res.json())
        .then(data => {
            // ★ 디버그
            console.log("allLogs 전체:", data.allLogs);
            console.log("첫 번째 로그 샘플:", data.allLogs ? data.allLogs[0] : "없음");
            console.log("allSundays 마지막 3개:", getSundaysUntilNow().slice(-3));

            // 1. 차트
            drawChart(data.deptStats);

            // 2. 오늘 명단
            let html = "";
            if (!data.todayList || data.todayList.length === 0) {
                html = "<tr><td colspan='4' style='padding:20px; color:#999;'>아직 출석자가 없습니다.</td></tr>";
            } else {
                data.todayList.forEach(log => {
                    let badgeClass = "bg-ok";
                    if (log.note === "지각") badgeClass = "bg-warn";
                    else if (log.note === "결석") badgeClass = "bg-danger";
                    else if (log.note !== "정상출석" && log.note !== "정상") badgeClass = "bg-no";
                    html += `<tr>
                        <td>${log.time}</td>
                        <td style="font-weight:bold">${log.name}</td>
                        <td>${log.dept}</td>
                        <td><span class="badge ${badgeClass}">${log.note || '출석'}</span></td>
                    </tr>`;
                });
            }
            listBody.innerHTML = html;

            // 3. 누적 순위
            window._allLogs = data.allLogs || [];
            renderRank('all');

            // 4. 개인 조회용 전체 데이터
            fullHistoryData = data.allLogs || [];
        })
        .catch(err => {
            listBody.innerHTML = "<tr><td colspan='4'>데이터 로드 실패</td></tr>";
            console.error("loadStatsData 오류:", err);
        });
} 
    function drawChart(stats) {
        const ctx = document.getElementById('deptChart').getContext('2d');
        if (deptChart) deptChart.destroy();
        deptChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: stats.map(d => d.dept),
                datasets: [{
                    label: '누적 평균 점수',
                    data: stats.map(d => d.rate),
                    backgroundColor: 'rgba(54, 162, 235, 0.7)',
                    borderRadius: 6,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, max: 100 } },
                plugins: { legend: { display: false } }
            }
        });
    }

    // ============================================================
    // 개인 조회 기능
    // ============================================================
    
    function getSundaysUntilNow() {
        let sundays = [];
        const now = new Date();
        const year = now.getFullYear(); 
        
        let d = new Date(year, 0, 1); 

        while (d.getDay() !== 0) {
            d.setDate(d.getDate() + 1);
        }

        while (d <= now) {
            const yearStr = d.getFullYear();
            const monthStr = String(d.getMonth() + 1).padStart(2, '0');
            const dayStr = String(d.getDate()).padStart(2, '0');
            
            sundays.push(`${yearStr}-${monthStr}-${dayStr}`);
            
            d.setDate(d.getDate() + 7);
        }
        return sundays;
    }
    function getQuarterMonths(q) {
        if (q === 'q1') return [1,2,3];
        if (q === 'q2') return [4,5,6];
        if (q === 'q3') return [7,8,9];
        if (q === 'q4') return [10,11,12];
        return null; // 전체
    }

    function renderRank(q) {
        const rankDiv = document.getElementById('rank-list');
        const months = getQuarterMonths(q);
        const logs = window._allLogs || [];

        // 1. 해당 분기 주일 목록
        const allSundays = getSundaysUntilNow().filter(d => {
            if (!months) return true;
            const m = parseInt(d.split('-')[1]);
            return months.includes(m);
        });

        if (allSundays.length === 0) {
            rankDiv.innerHTML = "<div style='padding:20px; color:#999;'>해당 분기 데이터가 없습니다.</div>";
            return;
        }

        const sundaySet = new Set(allSundays);

        // 2. 분기 내 로그만 필터 후 "날짜||이름" 키로 맵핑
        //    같은 날 중복 제출이면 높은 점수 유지
        const logMap = {}; // key: "2025-04-06||홍길동"
        logs.forEach(log => {
            if (!sundaySet.has(log.date)) return;
            const key = log.date + '||' + log.name;
            const incoming = parseInt(log.score) || 0;
            if (logMap[key] === undefined || incoming > logMap[key]) {
                logMap[key] = incoming;
            }
        });

        // 3. 멤버별로 전체 주일 순회하며 점수 합산
        //    로그가 없는 주일 = 0점으로 분모에 포함
        const memberMap = {}; // key: "홍길동||청년부"
        membersData.forEach(r => {
            const mKey = r[1] + '||' + r[0];
            memberMap[mKey] = { name: r[1], dept: r[0], total: 0 };
        });

        allSundays.forEach(sunday => {
            Object.entries(memberMap).forEach(([mKey, member]) => {
                const logKey = sunday + '||' + member.name;
                memberMap[mKey].total += (logMap[logKey] !== undefined ? logMap[logKey] : 0);
            });
        });

        const ranked = Object.values(memberMap)
            .map(p => ({ ...p, avg: Math.round(p.total / allSundays.length) }))
            .sort((a, b) => b.avg - a.avg)
            .slice(0, 20);

        let html = "";
        ranked.forEach((p, idx) => {
            let medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx+1}.`;
            html += `<div class="rank-item">
                <div class="rank-medal">${medal}</div>
                <div class="rank-name">${p.name} <span style="font-size:11px; color:#888; font-weight:normal">(${p.dept})</span></div>
                <div class="rank-score">${p.avg}점</div>
            </div>`;
        });
        rankDiv.innerHTML = html || "<div style='padding:20px; color:#999;'>데이터가 없습니다.</div>";
    }
    function filterRank(q, btn) {
        document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderRank(q);
    }
    function searchHistory() {
        const input = document.getElementById('history-search-input').value.trim();
        const resultDiv = document.getElementById('history-result');
        
        if(input.length < 2) { alert("이름을 2글자 이상 입력하세요."); return; }
        if(fullHistoryData.length === 0) { alert("전체 기록 데이터가 없습니다. (관리자 문의)"); return; }

        const userLogs = fullHistoryData.filter(log => log.name.includes(input));
        
        let logMap = {};
        userLogs.forEach(log => {
            logMap[log.date] = log;
        });

        const allSundays = getSundaysUntilNow();
        
        let finalHistory = [];
        let deptName = userLogs.length > 0 ? userLogs[0].dept : "-"; 

        allSundays.forEach(sundayDate => {
            if (logMap[sundayDate]) {
                finalHistory.push(logMap[sundayDate]);
            } else {
                finalHistory.push({
                    date: sundayDate,
                    time: "-",
                    name: input,
                    dept: deptName,
                    note: "결석"
                });
            }
        });

        finalHistory.sort((a, b) => new Date(b.date) - new Date(a.date));

        if(finalHistory.length === 0) {
            resultDiv.innerHTML = `<div style="padding:20px; color:#999;">조회된 기록이 없습니다.</div>`;
            return;
        }

        let html = `<div style="margin-top:10px; font-weight:bold; color:#007bff;">'${input}'님의 출석부</div>`;
        
        const absentCount = finalHistory.filter(l => l.note === "결석").length;
        html += `<div style="font-size:12px; color:#666; margin-bottom:10px;">총 ${finalHistory.length}회 중 <span style="color:#dc3545;">결석 ${absentCount}회</span></div>`;

        html += `<div style="margin-top:5px; border:1px solid #eee; border-radius:8px; overflow:hidden; max-height: 300px; overflow-y: auto;">
        <table class="log-table">
            <thead>
                <tr>
                    <th style="background:#f8f9fa; position:sticky; top:0;">날짜</th>
                    <th style="background:#f8f9fa; position:sticky; top:0;">시간</th>
                    <th style="background:#f8f9fa; position:sticky; top:0;">상태</th>
                </tr>
            </thead>
            <tbody>`;
        
        finalHistory.forEach(log => {
            let badge = "bg-ok";
            if(log.note === "지각") badge = "bg-warn";
            else if(log.note === "결석") badge = "bg-danger"; 
            else if(log.note !== "정상출석" && log.note !== "정상") badge = "bg-no";

            html += `<tr>
                <td>${log.date}</td>
                <td>${log.time}</td>
                <td><span class="badge ${badge}">${log.note}</span></td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
        
        resultDiv.innerHTML = html;
    }

    function fireConfetti() {
        var end = Date.now() + 1000;
        (function frame() {
            confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
            confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
